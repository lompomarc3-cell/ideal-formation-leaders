name: Build and publish IFL APK v4.0.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/build-apk-v4.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > flutter/android/app/ifl-keystore.jks
          cat > flutter/android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/ifl-keystore.jks
          EOF

      - name: Install dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build signed APK
        working-directory: flutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK signature and metadata
        run: |
          APK=flutter/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK" | tee /tmp/apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt
          "$AAPT" dump badging "$APK" | grep -E "package: name='com.ifl.ifl' versionCode='52' versionName='4.0.1'"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=flutter/build/app/outputs/flutter-apk/app-release.apk
          if gh release view v4.0.1 >/dev/null 2>&1; then
            gh release upload v4.0.1 "$APK#ifl-app-v4.0.1.apk" --clobber
          else
            gh release create v4.0.1 "$APK#ifl-app-v4.0.1.apk" \
              --title 'IFL v4.0.1 - Stabilisation finale' \
              --notes $'✅ Nom IDEAL FORMATION harmonisé\n✅ 41 dossiers professionnels (38 payants + 3 bonus)\n✅ Réinitialisation du mot de passe administrateur\n✅ Plan Pro mensuel 5 000 FCFA\n✅ Version Android 4.0.1 (build 52)'
          fi
